<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panier</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      background-color: #0f0603;
      color: #fff;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo img {
      width: 60px;
    }

    .header-icon i {
      font-size: 24px;
      cursor: pointer;
      margin-left: 15px;
    }

    .panier {
      padding: 50px 100px;
      text-align: center;
    }

    .panier h2 {
      font-size: 2rem;
      margin-bottom: 20px;
      color: #1b1b1b;
    }

    .cart-container {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .cart-items {
      flex: 2;
      background: #fff;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
    }

    .cart-item {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 15px;
    }

    .cart-item img {
      width: 100px;
      border-radius: 8px;
      margin-right: 20px;
    }

    .item-details h3 {
      margin: 0;
      font-size: 1.2rem;
      color: #1b1b1b;
    }

    .item-details p {
      margin: 5px 0;
      color: #bc9667;
      font-weight: bold;
    }

    .item-quantity {
      width: 60px;
      padding: 5px;
      text-align: center;
      margin-right: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .remove-item {
      background: #bc9667;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .remove-item:hover {
      background: #8a6f4d;
    }

    .cart-summary {
      flex: 1;
      background: #fff;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      text-align: left;
    }

    .cart-summary h3 {
      font-size: 1.5rem;
      margin-bottom: 20px;
    }

    .checkout-btn {
      width: 100%;
      padding: 12px;
      background: #bc9667;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
    }

    .checkout-btn:hover {
      background: #8a6f4d;
    }

    .footer {
      background-color: #0f0603;
      color: #fff;
      padding: 40px 20px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .footer-box {
      width: 30%;
    }

    .footer-box h3 {
      margin-bottom: 15px;
      font-size: 1.2rem;
      border-bottom: 2px solid #fff;
      padding-bottom: 5px;
    }

    .footer-box span {
      display: block;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }

    .footer-p {
      width: 100%;
      text-align: center;
      padding-top: 20px;
      border-top: 1px solid #fff;
    }

    @media (max-width: 768px) {
      .cart-container {
        flex-direction: column;
      }

      .footer-box {
        width: 100%;
        text-align: center;
        margin-bottom: 20px;
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="#" class="logo"><img src="logo.png" alt="Logo"></a>
    <div class="header-icon">
      <i class='bx bx-menu' id="menu-icon"></i>
      <i class='bx bx-cart' id="cart-icon"></i>
    </div>
  </header>

  <section class="panier">
    <h2>Mon Panier</h2>
    <div class="cart-container">
      <div class="cart-items">
        <div class="cart-item">
          <img src="product1.jpg" alt="Produit 1">
          <div class="item-details">
            <h3>Produit 1</h3>
            <p>Prix: $20</p>
            <input type="number" value="1" min="1" class="item-quantity">
            <button class="remove-item">Supprimer</button>
          </div>
        </div>
      </div>
      <div class="cart-summary">
        <h3>Total: $<span id="cart-total">20</span></h3>
        <button class="checkout-btn">Passer à la caisse</button>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="footer-box">
      <h3>Contact</h3>
      <span><i class='bx bx-map'></i> 123 Rue Principale, Paris</span>
      <span><i class='bx bx-phone'></i> +33 1 23 45 67 89</span>
      <span><i class='bx bx-envelope'></i> email@example.com</span>
    </div>
    <div class="footer-p">
      <p>&copy; 2025 Mon Site. Tous droits réservés.</p>
    </div>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const cartItems = document.querySelectorAll(".cart-item");
      const cartTotal = document.getElementById("cart-total");

      function updateTotal() {
        let total = 0;
        cartItems.forEach(item => {
          const price = parseFloat(item.querySelector("p").textContent.replace("Prix: $", ""));
          const quantity = parseInt(item.querySelector(".item-quantity").value);
          total += price * quantity;
        });
        cartTotal.textContent = total.toFixed(2);
      }

      cartItems.forEach(item => {
        item.querySelector(".item-quantity").addEventListener("change", updateTotal);
        item.querySelector(".remove-item").addEventListener("click", () => {
          item.remove();
          updateTotal();
        });
      });

      updateTotal();
    });
  </script>
</body>
</html>
